<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#202122">
  <meta name="description" content="The growing wiki for an early Godot pixel-art game. Explore its concept, mechanics, tutorials, and development notes.">
  <title>Home · PPP Game Wiki</title>
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="content.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <a class="skip-link pixel-button" href="#main">Skip to content</a>
  <div class="ambient-grid" aria-hidden="true"></div>
  <!-- TEMPLATE: SIDEBAR. Add sections in content.js; navigation is generated there. -->
  <aside class="sidebar" id="sidebar">
    <a class="brand" href="#home" aria-label="PPP wiki home"><span class="brand-mark" aria-hidden="true">P</span><span>PPP<span class="brand-sub">GAME WIKI</span></span></a>
    <div class="sidebar-rule"></div>
    <p class="micro-label">THE ARCHIVE</p>
    <nav id="navigation" aria-label="Wiki sections"></nav>
    <div class="sidebar-bottom">
      <div class="signal"><span class="signal-dot"></span> EARLY DEVELOPMENT</div>
      <p>A little world.<br>A work in progress.</p>
      <!-- TEMPLATE: BUTTON. Use .pixel-button; .primary and .small are variations. -->
      <button class="pixel-button small motion-toggle" type="button" aria-pressed="false">PAUSE MOTION <span aria-hidden="true">Ⅱ</span></button>
      <span class="micro-label sidebar-foot">BUILT IN GODOT · DOCUMENTED HERE</span>
    </div>
  </aside>
  <div class="workspace">
    <!-- TEMPLATE: TOP BAR / SEARCH. Search only indexes authored wiki content. -->
    <header class="topbar">
      <button class="menu-toggle pixel-button small" aria-label="Toggle navigation" aria-controls="sidebar" aria-expanded="false">☰</button>
      <div class="breadcrumbs"><span>ARCHIVE</span><span aria-hidden="true">/</span><strong id="breadcrumb">HOME</strong></div>
      <button class="search-trigger" type="button" aria-label="Search the wiki"><span class="pixel-search" aria-hidden="true"></span><span>Search the wiki</span><kbd>/</kbd></button>
    </header>
    <main id="main" tabindex="-1"></main>
    <footer class="footer"><span>PPP / GAME WIKI</span><span>EARLY PROTOTYPE <span aria-hidden="true">◆</span> ALWAYS EVOLVING</span><a href="#author">ABOUT THE AUTHOR ↗</a></footer>
  </div>
  <!-- TEMPLATE: ARTICLE DIALOG. Cards reuse this accessible native modal. -->
  <dialog id="article-dialog" class="pixel-dialog">
    <div class="dialog-top"><span id="article-type" class="micro-label">ARCHIVE ENTRY</span><button class="pixel-button small" data-close-dialog aria-label="Close article">✕</button></div>
    <h2 id="article-title"></h2><div id="article-body" class="prose"></div>
  </dialog>
  <!-- TEMPLATE: SEARCH DIALOG. Results are regular links, usable with a keyboard. -->
  <dialog id="search-dialog" class="pixel-dialog">
    <div class="dialog-top"><label for="search-input" class="micro-label">SEARCH THE ARCHIVE</label><button class="pixel-button small" data-close-dialog aria-label="Close search">✕</button></div>
    <input type="search" id="search-input" placeholder="Lore, movement, biomes…" autocomplete="off">
    <div id="search-results" aria-live="polite"></div>
  </dialog>
  <!-- TEMPLATE: ENTRY CARD. Modify once here; app.js creates its variations. -->
  <template id="entry-card-template">
    <button type="button" class="entry-card panel"><span class="card-top"><span class="card-number"></span><span class="badge"></span></span><span class="card-icon" aria-hidden="true"></span><span class="card-title"></span><span class="card-description"></span><span class="card-bottom"><span>OPEN ENTRY</span><span aria-hidden="true">↗</span></span></button>
  </template>
  <!-- TEMPLATE: DEVELOPMENT CHECKLIST ROW. Read-only indicator, never an input. -->
  <template id="checklist-template"><li class="checklist-row"><span class="check-indicator" aria-hidden="true"></span><span class="check-label"></span><span class="badge"></span></li></template>
</body>
</html>
